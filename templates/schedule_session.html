{% extends 'base.html' %}
{% block title %}Schedule Session – MentorMatch{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-0 shadow-sm p-4">
      <h4 class="fw-bold mb-1"><i class="bi bi-calendar-plus text-primary"></i> Schedule a Session</h4>
      <p class="text-muted small mb-4">
        With
        {% if user.role == 'mentor' %}
          <strong>{{ match.student.name }}</strong>
        {% else %}
          <strong>{{ match.mentor.name }}</strong>
        {% endif %}
      </p>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label fw-semibold">Session Title</label>
          <input type="text" name="title" class="form-control" placeholder="e.g. Introduction Call, Python Review" required />
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Date</label>
            <input type="date" name="date" class="form-control" required />
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Time</label>
            <input type="time" name="time" class="form-control" required />
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Notes <small class="text-muted fw-normal">(optional)</small></label>
          <textarea name="notes" class="form-control" rows="3" placeholder="Agenda, topics to cover, links..."></textarea>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary px-4">
            <i class="bi bi-calendar-check me-1"></i> Schedule
          </button>
          <a href="{{ url_for('sessions_list') }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
