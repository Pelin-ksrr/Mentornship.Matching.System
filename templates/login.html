{% extends 'base.html' %}
{% block title %}Login – MentorMatch{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <!-- Logo / Brand -->
    <div class="text-center mb-4 mt-2">
      <div class="d-inline-flex align-items-center justify-content-center mb-3"
           style="width:64px;height:64px;background:linear-gradient(135deg,#6366f1,#06b6d4);border-radius:18px;box-shadow:0 8px 24px rgba(99,102,241,0.35);">
        <i class="bi bi-people-fill text-white" style="font-size:1.8rem;"></i>
      </div>
      <h2 class="fw-bold mb-1" style="letter-spacing:-0.3px;">Welcome back</h2>
      <p class="text-muted" style="font-size:0.9rem;">Sign in to your MentorMatch account</p>
    </div>

    <div class="card border-0 p-4" style="border-radius:20px;box-shadow:0 8px 40px rgba(99,102,241,0.12);">
      <form method="POST">
        <div class="mb-3">
          <label class="form-label fw-semibold" style="font-size:0.875rem;">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-envelope" style="color:#6366f1;"></i></span>
            <input type="email" name="email" class="form-control" placeholder="you@example.com" required />
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold" style="font-size:0.875rem;">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-lock" style="color:#6366f1;"></i></span>
            <input type="password" name="password" id="pwd" class="form-control" placeholder="••••••••" required />
            <button class="btn btn-outline-secondary" type="button" onclick="togglePwd()" style="border-radius:0 10px 10px 0;">
              <i class="bi bi-eye" id="eye-icon"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mb-3" style="font-size:0.95rem;">
          <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>
      </form>
      <div class="text-center">
        <span class="text-muted" style="font-size:0.85rem;">Don't have an account?
          <a href="{{ url_for('register') }}" class="fw-semibold" style="color:#6366f1;">Sign up free</a>
        </span>
      </div>
    </div>

    <div class="text-center mt-3">
      <small class="text-muted">Admin demo: <code>admin@mentorship.com</code> / <code>admin123</code></small>
    </div>
  </div>
</div>
<script>
function togglePwd() {
  const p = document.getElementById('pwd');
  const i = document.getElementById('eye-icon');
  if (p.type === 'password') { p.type = 'text'; i.className = 'bi bi-eye-slash'; }
  else { p.type = 'password'; i.className = 'bi bi-eye'; }
}
</script>
{% endblock %}
