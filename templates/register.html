{% extends 'base.html' %}
{% block title %}Register – MentorMatch{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="text-center mb-4 mt-2">
      <div class="d-inline-flex align-items-center justify-content-center mb-3"
           style="width:64px;height:64px;background:linear-gradient(135deg,#6366f1,#06b6d4);border-radius:18px;box-shadow:0 8px 24px rgba(99,102,241,0.35);">
        <i class="bi bi-person-plus-fill text-white" style="font-size:1.8rem;"></i>
      </div>
      <h2 class="fw-bold mb-1" style="letter-spacing:-0.3px;">Create your account</h2>
      <p class="text-muted" style="font-size:0.9rem;">Join MentorMatch today — it's free</p>
    </div>
    <div class="card border-0 p-4" style="border-radius:20px;box-shadow:0 8px 40px rgba(99,102,241,0.12);">
      <form method="POST">
        <div class="mb-3">
          <label class="form-label fw-semibold">Full Name</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" name="name" class="form-control" placeholder="Your full name" required />
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Email Address</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" name="email" class="form-control" placeholder="you@example.com" required />
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Password <small class="text-muted">(min 6 chars)</small></label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" class="form-control" placeholder="••••••••" minlength="6" required />
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">I am a…</label>
          <div class="d-flex gap-3">
            <div class="form-check role-card flex-fill p-3 border rounded-3">
              <input class="form-check-input" type="radio" name="role" value="student" id="roleStudent" checked />
              <label class="form-check-label w-100" for="roleStudent">
                <i class="bi bi-mortarboard-fill fs-4 d-block mb-1" style="color:#6366f1;"></i>
                <strong>Student</strong>
                <div class="text-muted small">Looking for a mentor</div>
              </label>
            </div>
            <div class="form-check role-card flex-fill p-3 border rounded-3">
              <input class="form-check-input" type="radio" name="role" value="mentor" id="roleMentor" />
              <label class="form-check-label w-100" for="roleMentor">
                <i class="bi bi-person-badge-fill fs-4 d-block mb-1" style="color:#10b981;"></i>
                <strong>Mentor</strong>
                <div class="text-muted small">Ready to guide others</div>
              </label>
            </div>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">
          <i class="bi bi-person-check me-1"></i> Create Account
        </button>
      </form>
      <hr class="my-3" />
      <p class="text-center mb-0" style="font-size:0.85rem;color:#64748b;">
        Already have an account? <a href="{{ url_for('login') }}" class="fw-semibold" style="color:#6366f1;">Sign in</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
