{% extends 'base.html' %}
{% block title %}Edit Profile – MentorMatch{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card border-0 shadow-sm p-4">
      <h4 class="fw-bold mb-4"><i class="bi bi-pencil-square text-primary"></i> Edit Your Profile</h4>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label fw-semibold">Full Name</label>
          <input type="text" name="name" class="form-control" value="{{ user.name }}" required />
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Bio</label>
          <textarea name="bio" class="form-control" rows="3" placeholder="Tell us about yourself...">{{ user.bio }}</textarea>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Field / Industry</label>
            <input type="text" name="field" class="form-control" value="{{ user.field }}" placeholder="e.g. Software Engineering" />
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">City</label>
            <input type="text" name="city" class="form-control" value="{{ user.city }}" placeholder="e.g. Istanbul" />
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">
            Skills <small class="text-muted fw-normal">(comma separated)</small>
          </label>
          <input type="text" name="skills" class="form-control" value="{{ user.skills }}"
                 placeholder="e.g. Python, Machine Learning, Communication" />
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">
            Interests <small class="text-muted fw-normal">(comma separated)</small>
          </label>
          <input type="text" name="interests" class="form-control" value="{{ user.interests }}"
                 placeholder="e.g. AI, Data Science, Web Development" />
          <div class="form-text">Used for mentor-student matching algorithm.</div>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary px-4">
            <i class="bi bi-save me-1"></i> Save Changes
          </button>
          <a href="{{ url_for('profile') }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
